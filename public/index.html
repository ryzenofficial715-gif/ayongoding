<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub — PRD Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--card:#18181b;--border:#27272a;--primary:#06b6d4;
  --accent:#8b5cf6;--text:#fafafa;--muted:#a1a1aa;--success:#10b981;--error:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}

#loadingScreen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(6,182,212,0.2);animation:float linear infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:0.15}50%{transform:translateY(-40px) scale(1.3);opacity:0.6}}
#loadingLogo{font-size:clamp(2.2rem,6vw,3.2rem);font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 2s ease-in-out infinite;margin-bottom:28px;letter-spacing:-0.5px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#progressWrap{width:min(280px,70vw);height:5px;background:var(--border);border-radius:99px;overflow:hidden}
#progressBar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;width:0%;transition:width 0.3s ease}
#loadingText{color:var(--muted);font-size:0.85rem;margin-top:16px;font-family:'JetBrains Mono',monospace;min-height:22px}
.flash{position:fixed;inset:0;z-index:1000;background:#fff;animation:flashOut 0.7s ease forwards;pointer-events:none}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}

#app{display:none;max-width:900px;margin:0 auto;padding:clamp(20px,5vw,48px) 20px 80px}
header{text-align:center;margin-bottom:36px}
header h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-0.5px}
header p{color:var(--muted);font-size:clamp(0.9rem,2.5vw,1.05rem);line-height:1.6}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(16px,4vw,24px);margin-bottom:20px;transition:border-color 0.2s}
.card:focus-within{border-color:var(--primary)}
.card label{display:block;font-weight:600;margin-bottom:10px;color:#d4d4d8;font-size:0.95rem}
.card textarea{width:100%;height:120px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:0.95rem;resize:vertical;outline:none;font-family:inherit;line-height:1.6;transition:border-color 0.2s}
.card textarea:focus{border-color:var(--primary)}
.card textarea::placeholder{color:#52525b}

.btn{display:block;width:100%;padding:14px 20px;border-radius:12px;border:none;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.25s;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;letter-spacing:0.3px}
.btn:hover:not(:disabled){opacity:0.92;transform:translateY(-2px);box-shadow:0 8px 25px rgba(6,182,212,0.25)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-secondary{background:var(--border);color:#d4d4d8;margin-top:12px;box-shadow:none}
.btn-secondary:hover:not(:disabled){background:#3f3f46;transform:none;box-shadow:none}

.phase-container{margin-top:8px}
.phase-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(16px,4vw,24px);margin-bottom:18px;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.phase-card .phase-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.phase-card .phase-number{flex-shrink:0;width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.9rem}
.phase-card h3{color:var(--primary);font-size:1.05rem;line-height:32px}
.phase-card .phase-desc{color:#71717a;font-size:0.85rem;margin-bottom:18px;line-height:1.5}

.subfeature-block{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.subfeature-block h4{color:#a78bfa;font-size:0.9rem;margin-bottom:12px;font-weight:600}
.field-group{margin-bottom:12px}
.field-group:last-child{margin-bottom:0}
.field-group label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.field-group input{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85rem;outline:none;transition:border-color 0.2s;font-family:inherit}
.field-group input:focus{border-color:var(--primary)}
.field-group input::placeholder{color:#52525b}

.loading-dots{display:none;justify-content:center;gap:8px;padding:24px}
.loading-dots span{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:bounce 0.6s infinite alternate}
.loading-dots span:nth-child(2){animation-delay:0.15s;background:var(--accent)}
.loading-dots span:nth-child(3){animation-delay:0.3s;background:#ec4899}
@keyframes bounce{to{transform:translateY(-12px);opacity:0.3}}

.error-text{color:var(--error);text-align:center;display:none;padding:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;margin-bottom:16px;font-size:0.9rem;line-height:1.5}

.result-box{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(16px,4vw,24px);margin-top:24px;animation:fadeIn 0.5s ease}
.result-box h3{color:var(--success);margin-bottom:14px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.result-box pre{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;white-space:pre-wrap;word-wrap:break-word;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.7;max-height:520px;overflow-y:auto;color:#d4d4d8}
.result-box pre::-webkit-scrollbar{width:6px}
.result-box pre::-webkit-scrollbar-track{background:transparent}
.result-box pre::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

@media(max-width:640px){
  .field-group input{font-size:16px;padding:12px}
  .btn{padding:16px;font-size:1rem}
  .result-box pre{font-size:0.75rem;max-height:400px}
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div id="particlesContainer"></div>
  <div id="loadingLogo">AI HUB</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="loadingText"></div>
</div>

<div id="app">
  <header>
    <h1>AI HUB — PRD Generator</h1>
    <p>Tulis ide kasar kamu, AI pecah jadi 5 fase terstruktur. Isi detailnya, dapatkan prompt professional yang siap dipakai di AI coding manapun.</p>
  </header>

  <div class="card">
    <label>💡 Tulis ide project kamu</label>
    <textarea id="ideaInput" placeholder="Contoh: Saya mau bikin web AI chat kayak ChatGPT tapi bisa pilih banyak model gratis, ada dark mode, bisa upload file, sama ada fitur rekomendasi AI berdasarkan kebutuhan user..."></textarea>
    <button class="btn" id="btnBreakdown" disabled>🔍 Pecah Jadi 5 Fase</button>
  </div>

  <div class="loading-dots" id="loadingDots"><span></span><span></span><span></span></div>
  <p class="error-text" id="errorText"></p>

  <div id="phaseContainer" class="phase-container"></div>

  <button class="btn" id="btnGenerate" style="display:none;margin-top:24px">⚡ Generate Prompt Professional</button>

  <div class="result-box" id="resultBox">
    <h3>✅ Prompt Professional Siap Dipakai</h3>
    <pre id="promptOutput"></pre>
    <button class="btn btn-secondary" onclick="copyPrompt()">📋 Copy Prompt</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ========== LOADING SCREEN ==========
  const particlesContainer = document.getElementById('particlesContainer');
  for(let i = 0; i < 60; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
    p.style.animationDuration = (Math.random() * 3 + 2) + 's';
    p.style.animationDelay = Math.random() * 2 + 's';
    particlesContainer.appendChild(p);
  }

  const loadingText = document.getElementById('loadingText');
  const fullLoadingText = 'Menghubungkan ke AI engine...';
  let charIdx = 0;
  const typingTimer = setInterval(() => {
    if(charIdx <= fullLoadingText.length){
      loadingText.textContent = fullLoadingText.slice(0, charIdx) + '|';
      charIdx++;
    } else {
      clearInterval(typingTimer);
      loadingText.textContent = fullLoadingText;
    }
  }, 60);

  let progress = 0;
  const progressBar = document.getElementById('progressBar');
  const progressTimer = setInterval(() => {
    progress = Math.min(progress + Math.floor(Math.random() * 9 + 5), 100);
    progressBar.style.width = progress + '%';
    if(progress >= 100){
      clearInterval(progressTimer);
      const flash = document.createElement('div');
      flash.className = 'flash';
      document.body.appendChild(flash);
      setTimeout(() => {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        flash.remove();
      }, 600);
    }
  }, 160);

  // ========== APP STATE ==========
  const ideaInput = document.getElementById('ideaInput');
  const btnBreakdown = document.getElementById('btnBreakdown');
  const btnGenerate = document.getElementById('btnGenerate');
  const loadingDots = document.getElementById('loadingDots');
  const errorText = document.getElementById('errorText');
  const phaseContainer = document.getElementById('phaseContainer');
  const resultBox = document.getElementById('resultBox');
  const promptOutput = document.getElementById('promptOutput');

  let phasesData = [];
  let isGenerating = false;

  // ========== HELPERS ==========
  function showLoading(show){
    loadingDots.style.display = show ? 'flex' : 'none';
  }

  function showError(msg){
    errorText.textContent = msg;
    errorText.style.display = 'block';
    errorText.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideError(){
    errorText.style.display = 'none';
    errorText.textContent = '';
  }

  async function safeFetch(url, body){
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    // Cek content-type
    const contentType = res.headers.get('content-type') || '';
    
    if(!contentType.includes('application/json')){
      const text = await res.text();
      console.error('Non-JSON response:', text.substring(0, 200));
      throw new Error('Server mengembalikan respons tidak valid. Kemungkinan timeout AI.');
    }

    let data;
    try{
      data = await res.json();
    }catch(jsonErr){
      const text = await res.text();
      console.error('JSON parse error:', text.substring(0, 200));
      throw new Error('Gagal membaca respons server. Coba lagi.');
    }

    if(data.error){
      throw new Error(data.error);
    }

    if(data.success === false){
      throw new Error(data.error || 'Gagal memproses.');
    }

    return data;
  }

  // ========== EVENT LISTENERS ==========
  ideaInput.addEventListener('input', () => {
    btnBreakdown.disabled = ideaInput.value.trim().length < 10;
  });

  btnBreakdown.addEventListener('click', handleBreakdown);
  btnGenerate.addEventListener('click', handleGenerate);

  // ========== BREAKDOWN ==========
  async function handleBreakdown(){
    if(isGenerating) return;
    
    const idea = ideaInput.value.trim();
    if(idea.length < 10){
      showError('❌ Ide harus minimal 10 karakter ya.');
      return;
    }

    isGenerating = true;
    btnBreakdown.disabled = true;
    btnBreakdown.textContent = '⏳ Menganalisis ide...';
    showLoading(true);
    hideError();
    phaseContainer.innerHTML = '';
    btnGenerate.style.display = 'none';
    resultBox.style.display = 'none';

    try{
      const data = await safeFetch('/api/break-phases', { idea });

      if(!data.phases || data.phases.length === 0){
        throw new Error('AI tidak menghasilkan fase. Coba dengan ide yang lebih spesifik.');
      }

      phasesData = data.phases;
      renderPhases();
      btnGenerate.style.display = 'block';
      btnGenerate.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }catch(err){
      showError('❌ ' + err.message);
    }finally{
      isGenerating = false;
      btnBreakdown.disabled = false;
      btnBreakdown.textContent = '🔍 Pecah Jadi 5 Fase';
      showLoading(false);
    }
  }

  // ========== RENDER PHASES ==========
  function renderPhases(){
    phaseContainer.innerHTML = '';

    phasesData.forEach((phase, pi) => {
      const phaseDiv = document.createElement('div');
      phaseDiv.className = 'phase-card';

      let subfeaturesHTML = '';
      (phase.subfeatures || []).forEach((sub, si) => {
        subfeaturesHTML += `
          <div class="subfeature-block">
            <h4>${si + 1}. ${sub.name}</h4>
            ${(sub.fields || []).map((field, fi) => `
              <div class="field-group">
                <label>${field}</label>
                <input type="text" 
                       placeholder="Isi ${field.toLowerCase()}..." 
                       data-phase="${pi}" 
                       data-sub="${si}" 
                       data-field="${fi}"
                       autocomplete="off">
              </div>
            `).join('')}
          </div>
        `;
      });

      phaseDiv.innerHTML = `
        <div class="phase-header">
          <div class="phase-number">${pi + 1}</div>
          <h3>${phase.name}</h3>
        </div>
        <p class="phase-desc">${phase.description || ''}</p>
        ${subfeaturesHTML}
      `;

      phaseContainer.appendChild(phaseDiv);
    });
  }

  // ========== GENERATE ==========
  async function handleGenerate(){
    if(isGenerating) return;

    const inputs = document.querySelectorAll('#phaseContainer input');
    const projectData = {
      idea: ideaInput.value.trim(),
      phases: []
    };

    inputs.forEach(input => {
      const pi = parseInt(input.dataset.phase);
      const si = parseInt(input.dataset.sub);
      const fi = parseInt(input.dataset.field);
      const value = input.value.trim();

      if(!projectData.phases[pi]){
        projectData.phases[pi] = { name: phasesData[pi].name, subfeatures: [] };
      }
      if(!projectData.phases[pi].subfeatures[si]){
        projectData.phases[pi].subfeatures[si] = { name: phasesData[pi].subfeatures[si].name, fields: [] };
      }
      projectData.phases[pi].subfeatures[si].fields[fi] = {
        name: phasesData[pi].subfeatures[si].fields[fi],
        value: value
      };
    });

    isGenerating = true;
    btnGenerate.disabled = true;
    btnGenerate.textContent = '⏳ Generating prompt professional...';
    showLoading(true);
    hideError();
    resultBox.style.display = 'none';

    try{
      const data = await safeFetch('/api/generate', { projectData });

      if(!data.prompt){
        throw new Error('AI tidak menghasilkan prompt.');
      }

      promptOutput.textContent = data.prompt;
      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }catch(err){
      showError('❌ ' + err.message);
    }finally{
      isGenerating = false;
      btnGenerate.disabled = false;
      btnGenerate.textContent = '⚡ Generate Prompt Professional';
      showLoading(false);
    }
  }

  // ========== COPY ==========
  window.copyPrompt = function(){
    const text = promptOutput.textContent;
    if(!text) return;

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => {
        showCopySuccess();
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  };

  function fallbackCopy(text){
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try{
      document.execCommand('copy');
      showCopySuccess();
    }catch(err){
      alert('Gagal copy. Silakan copy manual.');
    }
    document.body.removeChild(textarea);
  }

  function showCopySuccess(){
    const btn = document.querySelector('.btn-secondary');
    const original = btn.textContent;
    btn.textContent = '✅ Tersalin!';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = original;
      btn.disabled = false;
    }, 1800);
  }

})();
</script>
</body>
</html>
